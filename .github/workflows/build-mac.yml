name: Build Mac App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-mac:
    # Build for Intel Macs
    runs-on: macos-15-intel

    steps:
      # Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java 21
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Compile the Java source code
      - name: Compile
        run: |
          mkdir -p build/classes

          javac \
            -cp "lib/gson-2.13.2.jar" \
            -d build/classes \
            src/*.java

      # Create the JAR
      - name: Create JAR
        run: |
          mkdir -p build/jar

          jar cfm build/jar/Payroll.jar \
            src/META-INF/MANIFEST.MF \
            -C build/classes .

      # Copy Gson into the application directory
      - name: Copy dependencies
        run: |
          cp lib/gson-2.13.2.jar build/jar/

      # Create the Mac application
      - name: Create Mac App
        run: |
          mkdir -p build/app

          jpackage \
            --type app-image \
            --name "Payroll Manager" \
            --input build/jar \
            --main-jar Payroll.jar \
            --main-class Main \
            --dest build/app \
            --app-version 1.1 \
            --java-options "-cp \$APPDIR/Payroll.jar:\$APPDIR/gson-2.13.2.jar"

      # Zip the application
      - name: Zip Mac App
        run: |
          cd build/app
          zip -r "../../Payroll-Manager-Mac.zip" "Payroll Manager.app"

      # Upload the application to GitHub
      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: Payroll-Manager-Mac-Intel
          path: Payroll-Manager-Mac.zip