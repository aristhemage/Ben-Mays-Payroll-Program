name: Build Mac App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-mac:
    # Apple Silicon Mac runner
    runs-on: macos-14

    steps:
      # Download our GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java 21
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Compile the Java source code
      - name: Compile
        run: |
          mkdir -p build/classes

          javac \
            -d build/classes \
            src/*.java

      # Create the JAR file
      - name: Create JAR
        run: |
          mkdir -p build/jar

          jar cfm build/jar/Payroll.jar \
            src/META-INF/MANIFEST.MF \
            -C build/classes .

      # Create the Mac .app
      - name: Create Mac App
        run: |
          mkdir -p build/app

          jpackage \
            --type app-image \
            --name "Payroll Manager" \
            --input build/jar \
            --main-jar Payroll.jar \
            --main-class Main \
            --dest build/app \
            --app-version 1.0.0

      # Put the .app into a ZIP file
      - name: Zip Mac App
        run: |
          cd build/app
          zip -r "../../Payroll-Manager-Mac.zip" "Payroll Manager.app"

      # Make the ZIP available for download from GitHub
      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: Payroll-Manager-Mac
          path: Payroll-Manager-Mac.zip